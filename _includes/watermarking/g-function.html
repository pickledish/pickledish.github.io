<div class="watermark-widget">
  <div class="card">
    <div class="card-heading">
      <div>
        <p class="kicker">Candidate selection</p>
        <h3 id="stage3-heading" aria-live="polite">
          “My favorite fruit is <span class="sampled-token is-blank" id="stage3-token">…</span>”
        </h3>
      </div>
    </div>

    <div class="draw-pair">
      <div class="draw-column">
        <div class="draw-panel" id="stage3-panel-a">
          <span class="slot-label">Draw A</span>
          <div class="interval-track" id="stage3-track-a">
            <div class="interval mango" style="width: 65%"></div>
            <div class="interval banana" style="width: 20%"></div>
            <div class="interval coconut" style="width: 10%"></div>
            <div class="interval papaya" style="width: 5%"></div>
            <div class="draw-marker" id="stage3-marker-a" hidden>
              <span id="stage3-marker-a-label">0.000</span>
            </div>
          </div>
          <div class="track-labels" aria-hidden="true">
            <span>0</span><span>0.65</span><span>0.85</span><span>0.95</span><span>1</span>
          </div>
        </div>
        <div class="flow-arrow" aria-hidden="true"></div>
      </div>
      <div class="draw-column">
        <div class="draw-panel" id="stage3-panel-b">
          <span class="slot-label">Draw B</span>
          <div class="interval-track" id="stage3-track-b">
            <div class="interval mango" style="width: 65%"></div>
            <div class="interval banana" style="width: 20%"></div>
            <div class="interval coconut" style="width: 10%"></div>
            <div class="interval papaya" style="width: 5%"></div>
            <div class="draw-marker" id="stage3-marker-b" hidden>
              <span id="stage3-marker-b-label">0.000</span>
            </div>
          </div>
          <div class="track-labels" aria-hidden="true">
            <span>0</span><span>0.65</span><span>0.85</span><span>0.95</span><span>1</span>
          </div>
        </div>
        <div class="flow-arrow" aria-hidden="true"></div>
      </div>
    </div>

    <div class="candidate-arena" id="stage3-arena">
      <div class="candidate-slot">
        <span class="slot-label">Draw A</span>
        <div class="candidate-token placeholder" id="stage3-candidate-a">?</div>
      </div>
      <div class="versus">
        <span></span>
        <div class="g-core" id="stage3-g" aria-hidden="true">
          <strong>g</strong>
        </div>
        <span></span>
      </div>
      <div class="candidate-slot">
        <span class="slot-label">Draw B</span>
        <div class="candidate-token placeholder" id="stage3-candidate-b">?</div>
      </div>
    </div>

    <button class="button button-primary" id="sample-g" type="button">
      Draw two, then g
    </button>
  </div>
</div>
