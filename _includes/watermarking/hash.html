<div class="watermark-widget">
  <div class="card">
    <div class="card-heading">
      <div>
        <p class="kicker">g-function</p>
        <h3>“My favorite fruit is …”</h3>
      </div>
    </div>

    <div class="score-list">
      <div class="score-row" id="g-score-mango" style="--token-color: var(--mango)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>mango</span>
        </div>
        <code class="score-hash" id="g-score-mango-hash"></code>
        <div class="score-bits" id="g-score-mango-bits">
          <span class="score-binary" id="g-score-mango-binary"></span>
          <span class="score-mark" id="g-score-mango-mark"></span>
        </div>
      </div>
      <div class="score-row" id="g-score-banana" style="--token-color: var(--banana)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>banana</span>
        </div>
        <code class="score-hash" id="g-score-banana-hash"></code>
        <div class="score-bits" id="g-score-banana-bits">
          <span class="score-binary" id="g-score-banana-binary"></span>
          <span class="score-mark" id="g-score-banana-mark"></span>
        </div>
      </div>
      <div class="score-row" id="g-score-coconut" style="--token-color: var(--coconut)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>coconut</span>
        </div>
        <code class="score-hash" id="g-score-coconut-hash"></code>
        <div class="score-bits" id="g-score-coconut-bits">
          <span class="score-binary" id="g-score-coconut-binary"></span>
          <span class="score-mark" id="g-score-coconut-mark"></span>
        </div>
      </div>
      <div class="score-row" id="g-score-papaya" style="--token-color: var(--papaya)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>papaya</span>
        </div>
        <code class="score-hash" id="g-score-papaya-hash"></code>
        <div class="score-bits" id="g-score-papaya-bits">
          <span class="score-binary" id="g-score-papaya-binary"></span>
          <span class="score-mark" id="g-score-papaya-mark"></span>
        </div>
      </div>
    </div>

    <form class="score-form" id="g-score-form">
      <input
        class="score-input"
        id="g-score-secret"
        type="text"
        name="secret"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        aria-label="secret key"
        placeholder="secret key"
      >
      <button class="button button-primary" type="submit">Calculate</button>
    </form>
  </div>
</div>
