<div class="watermark-widget">
  <div class="card">
    <div class="card-heading">
      <div>
        <p class="kicker">Tournament sampling</p>
        <h3 id="bracket-heading" aria-live="polite">
          “My favorite fruit is <span class="sampled-token is-blank" id="bracket-token">…</span>”
        </h3>
      </div>
    </div>

    <div class="bracket" id="bracket" aria-label="3-round token tournament">
      <div class="bracket-match" data-round="2" data-match="0">
        <div class="bracket-match" data-round="1" data-match="0">
          <div class="bracket-match" data-round="0" data-match="0">
            <div class="candidate-token placeholder" data-slot="0-0">?</div>
            <div class="candidate-token placeholder" data-slot="0-1">?</div>
            <div class="bracket-corridor" aria-hidden="true">
              <span class="bracket-arm"></span>
              <span class="bracket-arm"></span>
              <div class="bracket-g-anchor">
                <div class="g-core g-mini" data-g="0-0">
                  <strong>g</strong><span class="g-idx">1</span>
                </div>
              </div>
            </div>
            <div class="candidate-token placeholder" data-slot="1-0">?</div>
          </div>
          <div class="bracket-match" data-round="0" data-match="1">
            <div class="candidate-token placeholder" data-slot="0-2">?</div>
            <div class="candidate-token placeholder" data-slot="0-3">?</div>
            <div class="bracket-corridor" aria-hidden="true">
              <span class="bracket-arm"></span>
              <span class="bracket-arm"></span>
              <div class="bracket-g-anchor">
                <div class="g-core g-mini" data-g="0-1">
                  <strong>g</strong><span class="g-idx">1</span>
                </div>
              </div>
            </div>
            <div class="candidate-token placeholder" data-slot="1-1">?</div>
          </div>
          <div class="bracket-corridor" aria-hidden="true">
            <span class="bracket-arm"></span>
            <span class="bracket-arm"></span>
            <div class="bracket-g-anchor">
              <div class="g-core g-mini" data-g="1-0">
                <strong>g</strong><span class="g-idx">2</span>
              </div>
            </div>
          </div>
          <div class="candidate-token placeholder" data-slot="2-0">?</div>
        </div>
        <div class="bracket-match" data-round="1" data-match="1">
          <div class="bracket-match" data-round="0" data-match="2">
            <div class="candidate-token placeholder" data-slot="0-4">?</div>
            <div class="candidate-token placeholder" data-slot="0-5">?</div>
            <div class="bracket-corridor" aria-hidden="true">
              <span class="bracket-arm"></span>
              <span class="bracket-arm"></span>
              <div class="bracket-g-anchor">
                <div class="g-core g-mini" data-g="0-2">
                  <strong>g</strong><span class="g-idx">1</span>
                </div>
              </div>
            </div>
            <div class="candidate-token placeholder" data-slot="1-2">?</div>
          </div>
          <div class="bracket-match" data-round="0" data-match="3">
            <div class="candidate-token placeholder" data-slot="0-6">?</div>
            <div class="candidate-token placeholder" data-slot="0-7">?</div>
            <div class="bracket-corridor" aria-hidden="true">
              <span class="bracket-arm"></span>
              <span class="bracket-arm"></span>
              <div class="bracket-g-anchor">
                <div class="g-core g-mini" data-g="0-3">
                  <strong>g</strong><span class="g-idx">1</span>
                </div>
              </div>
            </div>
            <div class="candidate-token placeholder" data-slot="1-3">?</div>
          </div>
          <div class="bracket-corridor" aria-hidden="true">
            <span class="bracket-arm"></span>
            <span class="bracket-arm"></span>
            <div class="bracket-g-anchor">
              <div class="g-core g-mini" data-g="1-1">
                <strong>g</strong><span class="g-idx">2</span>
              </div>
            </div>
          </div>
          <div class="candidate-token placeholder" data-slot="2-1">?</div>
        </div>
        <div class="bracket-corridor" aria-hidden="true">
          <span class="bracket-arm"></span>
          <span class="bracket-arm"></span>
          <div class="bracket-g-anchor">
            <div class="g-core g-mini" data-g="2-0">
              <strong>g</strong><span class="g-idx">3</span>
            </div>
          </div>
        </div>
        <div class="candidate-token placeholder" data-slot="3-0">?</div>
      </div>
    </div>

    <div class="button-row bracket-actions">
      <button class="button button-primary" id="bracket-step" type="button">Step</button>
      <button class="button button-toggle" id="bracket-reset" type="button">Reset</button>
    </div>
  </div>
</div>
