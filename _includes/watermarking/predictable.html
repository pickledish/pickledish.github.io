<div class="watermark-widget">
  <div class="card">
    <div class="card-heading">
      <div>
        <p class="kicker">Example probability distribution</p>
        <h3>“All the world’s a …”</h3>
      </div>
    </div>

    <div class="probability-list">
      <div class="probability-row" style="--token-color: var(--mango)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>stage</span>
        </div>
        <div class="probability-bar">
          <span style="--width: 99%; animation-delay: 0ms"></span>
        </div>
        <span class="probability-value">99%</span>
      </div>
      <div class="probability-row" style="--token-color: var(--papaya)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>mess</span>
        </div>
        <div class="probability-bar">
          <span style="--width: 1%; animation-delay: 80ms"></span>
        </div>
        <span class="probability-value">1%</span>
      </div>
    </div>
  </div>
</div>
