<div class="watermark-widget">
  <div class="card">
    <div class="card-heading">
      <div>
        <p class="kicker">Sampling</p>
        <h3>Draw a random number on those intervals</h3>
      </div>
    </div>

    <p class="card-note">
      Each token owns a slice of the unit interval, sized by its probability.
      A uniform draw between 0 and 1 lands in exactly one slice, and that
      slice’s token is the sample.
    </p>

    <div class="interval-track" id="stage1-track">
      <div class="interval mango" style="width: 65%"></div>
      <div class="interval banana" style="width: 20%"></div>
      <div class="interval coconut" style="width: 10%"></div>
      <div class="interval papaya" style="width: 5%"></div>
      <div class="draw-marker" id="stage1-marker" hidden>
        <span id="stage1-marker-label">0.000</span>
      </div>
    </div>
    <div class="track-labels" aria-hidden="true">
      <span>0</span><span>0.65</span><span>0.85</span><span>0.95</span><span>1</span>
    </div>

    <button class="button button-primary" id="sample-one" type="button">
      Draw a random number
    </button>

    <div class="result-sentence" id="stage1-result" aria-live="polite">
      <span>Waiting for a draw</span>
      <strong>—</strong>
    </div>
  </div>
</div>
