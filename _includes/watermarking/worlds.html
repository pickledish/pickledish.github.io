<div class="watermark-widget">
  <div class="card">
    <div class="card-heading">
      <div>
        <p class="kicker">Across all g functions</p>
        <h3>Chance of “papaya”</h3>
      </div>
    </div>

    <div class="worlds-chart">
      <div class="worlds-y" aria-hidden="true">
        <div class="worlds-y-scale" id="worlds-y-scale">
          <span class="is-top" style="bottom: 100%">1</span>
          <span class="is-bottom" style="bottom: 0%">0</span>
        </div>
      </div>
      <div class="worlds-plot" id="worlds-plot" role="img" aria-label="Histogram of how many g-functions give papaya each probability"></div>
      <div class="worlds-axis" aria-hidden="true">
        <span style="left: 0%">0%</span>
        <span style="left: 20%">10%</span>
        <span style="left: 40%">20%</span>
        <span style="left: 60%">30%</span>
        <span style="left: 80%">40%</span>
        <span style="left: 100%">50%</span>
      </div>
    </div>

    <div class="worlds-controls">
      <button class="button button-toggle" id="worlds-prev" type="button" aria-label="Fewer rounds" disabled>
        ←
      </button>
      <p class="worlds-round" id="worlds-round" aria-live="polite">0 rounds (1 mood)</p>
      <button class="button button-toggle" id="worlds-next" type="button" aria-label="More rounds">
        →
      </button>
    </div>
  </div>
</div>
