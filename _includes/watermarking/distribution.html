<div class="watermark-widget">
  <div class="card">
    <div class="card-heading">
      <div>
        <p class="kicker">Example probability distribution</p>
        <h3>“My favorite fruit is …”</h3>
      </div>
      <span class="status-pill">next token</span>
    </div>

    <div class="probability-list">
      <div class="probability-row" style="--token-color: var(--mango)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>mango</span>
        </div>
        <div class="probability-bar">
          <span style="--width: 65%; animation-delay: 0ms"></span>
        </div>
        <span class="probability-value">65%</span>
      </div>
      <div class="probability-row" style="--token-color: var(--banana)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>banana</span>
        </div>
        <div class="probability-bar">
          <span style="--width: 20%; animation-delay: 80ms"></span>
        </div>
        <span class="probability-value">20%</span>
      </div>
      <div class="probability-row" style="--token-color: var(--coconut)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>coconut</span>
        </div>
        <div class="probability-bar">
          <span style="--width: 10%; animation-delay: 160ms"></span>
        </div>
        <span class="probability-value">10%</span>
      </div>
      <div class="probability-row" style="--token-color: var(--papaya)">
        <div class="token-name">
          <span class="token-dot"></span>
          <span>papaya</span>
        </div>
        <div class="probability-bar">
          <span style="--width: 5%; animation-delay: 240ms"></span>
        </div>
        <span class="probability-value">5%</span>
      </div>
    </div>
  </div>
</div>
